name: musicapp
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  just_audio: ^0.10.5
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  just_audio_background: ^0.0.1-beta.17
  google_fonts: ^6.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  device_preview: ^1.2.0
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0
  google_mobile_ads: ^6.0.0
  in_app_update: ^4.2.5
  in_app_review: ^2.0.11

dev_dependencies:
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/gorget.png"
  min_sdk_android: 21 

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/gorge3.jpg
    - assets/gorge5.jpg
